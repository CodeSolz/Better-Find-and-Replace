name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.3.8

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, dom, curl
          tools: composer

      - name: 📦 Install dependencies (include vendor)
        run: composer install --no-dev

      - name: 🛠️ Build plugin
        run: composer run build

      - name: 🏷️ Extract version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 📝 Extract changelog for version
        id: changelog
        run: |
          VERSION="👉 **Version: ${{ steps.extract_version.outputs.VERSION }}"
          CHANGELOG=$(awk -v ver="$VERSION" '
            $0 ~ ver {
                capture=1; print $0; next
            }
            capture && /^👉 \*\*Version:/ { capture=0; exit }
            capture { print }
          ' changelog.md)
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 📁 Prepare ZIP and TAR.GZ with proper structure
        run: |
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          PLUGIN_DIR="real-time-auto-find-and-replace"
          ZIP_NAME="real-time-auto-find-and-replace.${VERSION}.zip"
          TAR_NAME="real-time-auto-find-and-replace.${VERSION}.tar.gz"

          mkdir "$PLUGIN_DIR"
          shopt -s dotglob
          cp -r !(vendor|node_modules|.git|.github|*.zip|*.tar.gz) "$PLUGIN_DIR" || true
          cp -r vendor "$PLUGIN_DIR"

          zip -r "$ZIP_NAME" "$PLUGIN_DIR"
          tar -czf "$TAR_NAME" "$PLUGIN_DIR"

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: 🚀 Create GitHub Release (with zip and tar.gz)
        uses: softprops/action-gh-release@v1
        with:
          name: Version ${{ steps.extract_version.outputs.VERSION }}
          tag_name: v${{ steps.extract_version.outputs.VERSION }}
          body: ${{ env.CHANGELOG }}
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.TAR_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
