name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.3.8

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, dom, curl
          tools: composer

      - name: 📦 Install dependencies (include vendor)
        run: composer install --no-dev

      - name: 🛠️ Build plugin
        run: composer run build

      - name: 🏷️ Extract version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 📝 Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          HEADER_REGEX="^### Version: ${VERSION}"

          HEADER_LINE=$(grep -m1 "$HEADER_REGEX" "${GITHUB_WORKSPACE}/changelog.md" | sed 's/^### /## /')
          BODY=$(awk -v header="### Version: ${VERSION}" '
            $0 ~ header {
              capture = 1
              next
            }
            capture && /^### Version:/ {
              exit
            }
            capture { print }
          ' "${GITHUB_WORKSPACE}/changelog.md")

          if [ -z "$HEADER_LINE" ] || [ -z "$BODY" ]; then
            echo "❌ Changelog not found for version $VERSION"
            exit 1
          fi

          echo "CHANGELOG_HEADER<<EOF" >> $GITHUB_ENV
          echo "$HEADER_LINE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "CHANGELOG_BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 📁 Prepare ZIP and TAR.GZ with proper structure
        run: |
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          PLUGIN_SLUG="real-time-auto-find-and-replace"
          ZIP_NAME="${PLUGIN_SLUG}.${VERSION}.zip"
          TAR_NAME="${PLUGIN_SLUG}.${VERSION}.tar.gz"

          mkdir -p build/${PLUGIN_SLUG}

          # Copy all files into clean plugin folder (exclude trash)
          rsync -av --exclude=".git" --exclude=".github" --exclude="node_modules" \
            --exclude="${ZIP_NAME}" --exclude="${TAR_NAME}" ./ build/${PLUGIN_SLUG}/

          # Ensure vendor is included
          cp -r vendor build/${PLUGIN_SLUG}/

          cd build
          zip -r "../${ZIP_NAME}" "${PLUGIN_SLUG}"
          tar -czf "../${TAR_NAME}" "${PLUGIN_SLUG}"

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "TAR_NAME=${TAR_NAME}" >> $GITHUB_ENV

      - name: 🚀 Create GitHub Release (with zip and tar.gz)
        uses: softprops/action-gh-release@v1
        with:
          name: Version ${{ steps.extract_version.outputs.VERSION }}
          tag_name: v${{ steps.extract_version.outputs.VERSION }}
          body: |
            ${{ env.CHANGELOG_HEADER }}

            ${{ env.CHANGELOG_BODY }}
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.TAR_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
